<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Vault — Sign In</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="ledger-card">
      <h1 id="form-title">Welcome back</h1>
      <p class="tagline">The Vault — a private archive for your documents.</p>

      <div id="error-banner" class="error-banner"></div>

      <form id="auth-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" minlength="8">
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">Log in</button>
      </form>

      <div class="switch-line">
        <span id="switch-text">Need an account?</span>
        <button type="button" id="switch-btn">Sign up</button>
      </div>
    </div>
  </div>

  <script src="/static/js/auth.js"></script>
</body>
</html>
